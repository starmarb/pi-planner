name: Deploy to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 폴더 구조를 어떻게 커밋했든 index.html이 있는 곳을 찾아냅니다.
      # (docs/ · deploy/docs/ · 저장소 루트 모두 대응)
      - name: Find the folder to publish
        id: find
        run: |
          if   [ -f docs/index.html ];        then echo "dir=docs"        >> "$GITHUB_OUTPUT"
          elif [ -f deploy/docs/index.html ]; then echo "dir=deploy/docs" >> "$GITHUB_OUTPUT"
          elif [ -f index.html ];             then echo "dir=."           >> "$GITHUB_OUTPUT"
          else
            echo "::error::index.html을 찾지 못했습니다. 아래 트리를 확인하세요."
            find . -name node_modules -prune -o -type f -print | head -60
            exit 1
          fi
          echo "publishing: $(cat "$GITHUB_OUTPUT")"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.dir }}

      - id: deployment
        uses: actions/deploy-pages@v4
